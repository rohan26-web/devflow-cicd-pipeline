name: CI

# Runs on feature/bugfix/develop pushes and on pull requests to main or develop.
# Pushes to main are handled by ci-cd.yml, which CALLS this workflow
# (workflow_call) and then publishes the image. This avoids duplicate runs.
on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
      - develop
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run pytest with coverage (fails under 80%)
        run: |
          mkdir -p reports
          pytest --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml --cov-report=html:reports/htmlcov --cov-fail-under=80

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: reports/
          retention-days: 14

  docker-scan:
    name: docker-build-and-scan
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image (not pushed)
        run: docker build -t devflow:ci .

      - name: Smoke test container
        run: |
          docker run -d --name devflow-smoke -p 5000:5000 devflow:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then echo; exit 0; fi
            sleep 2
          done
          docker logs devflow-smoke
          exit 1

      - name: Trivy report (all severities, informational)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devflow:ci
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          output: trivy-report.txt

      - name: Show Trivy report
        if: always()
        run: cat trivy-report.txt || true

      - name: Trivy gate (fail on CRITICAL or HIGH with a fix available)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: devflow:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: ignore
          retention-days: 14
